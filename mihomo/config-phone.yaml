## ==================== 06. DNS（fake-ip 分流 / 上游服务器 / 域名嗅探前）====================
dns: 
  enable: true
  ipv6: true
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  prefer-h3: true
  respect-rules: false
  listen: "[::]:53"
  enhanced-mode: fake-ip
  fake-ip-range: 7.0.0.0/8
  #fake-ip-range6: 2001:db8::/32
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    # 列表内域名返回 fake-ip，其余域名返回真实 IP
    - RULE-SET:ai
    - RULE-SET:youtube
    - RULE-SET:google
    - RULE-SET:github
    - RULE-SET:cloudflare
    - RULE-SET:microsoft
    - RULE-SET:apple
    - RULE-SET:telegram
    - RULE-SET:SocialMedia
    - RULE-SET:tiktok
    - RULE-SET:reddit
    - RULE-SET:twitch
    - RULE-SET:streaming
    - RULE-SET:steam
    - RULE-SET:games-global
    - RULE-SET:category-finance
    - RULE-SET:stripe
    - RULE-SET:paypal
    - RULE-SET:category-cryptocurrency
    - RULE-SET:proxy
    - RULE-SET:gfw
  default-nameserver: ['system','223.5.5.5']
  proxy-server-nameserver: *proxy-dns-jiedian
  nameserver: *direct-dns
sniffer: 
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff: { HTTP: { ports: [80,8080-8880], override-destination: true }, TLS: { ports: [443,8443] }, QUIC: { ports: [443,8443] } }
  skip-domain: ['rule-set:private',"+.push.apple.com","Mijia Cloud","+.oray.com"]     
  skip-src-address: ['rule-set:private_ip']
  skip-dst-address: ['rule-set:private_ip']
