## ==================== 07. 域名嗅探 sniffer ====================
sniffer: 
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff: { HTTP: { ports: [80,8080-8880], override-destination: true }, TLS: { ports: [443,8443] }, QUIC: { ports: [443,8443] } }
  skip-domain: ['rule-set:private',"+.push.apple.com","Mijia Cloud","+.oray.com"]     
  skip-src-address: ['rule-set:private_ip']
  skip-dst-address: ['rule-set:private_ip']
## ==================== 08. 规则 rules（含 QUIC 处理锚点）====================
quic: &quic 'AND,((NETWORK,udp),(DST-PORT,443)),代理QUIC'
rules:
  ## —— ① 直连优先（内网 / 国内站点 / 广告拦截）——
  - RULE-SET,private,直接连接
  - RULE-SET,private_ip,直接连接,no-resolve
  - RULE-SET,fnnas,直接连接
  - RULE-SET,adblockfilters,REJECT
  - RULE-SET,adblockfilters2,REJECT
  - RULE-SET,douyin,直接连接
  - RULE-SET,bilibili,直接连接
  - RULE-SET,tencent,直接连接
  - RULE-SET,jd,直接连接
  - RULE-SET,alibaba,直接连接
  - RULE-SET,xiaohongshu,直接连接
  - RULE-SET,sina,直接连接
  - RULE-SET,pinduoduo,直接连接
  - RULE-SET,category-media-cn,直接连接
  - RULE-SET,xptv,直接连接
  - RULE-SET,nvidia,直接连接
  - RULE-SET,amd,直接连接
  - RULE-SET,asus,直接连接
  - RULE-SET,steam-cn,直接连接
  - RULE-SET,bing-cn,直接连接
  - RULE-SET,microsoft-cn,直接连接
  - RULE-SET,apple-cn,直接连接
  - RULE-SET,category-games-cn,直接连接
  - RULE-SET,other-direct,直接连接
  
  ## —— ② 代理：按规则集交给对应分组 ——
  - SUB-RULE,(RULE-SET,docker),download_rules
  - SUB-RULE,(RULE-SET,download),download_rules
  - SUB-RULE,(RULE-SET,apple),apple_rules
  - SUB-RULE,(RULE-SET,ai),ai_rules
  - SUB-RULE,(RULE-SET,youtube),youtube_rules
  - SUB-RULE,(RULE-SET,google),google_rules
  - SUB-RULE,(RULE-SET,cloudflare),cloudflare_rules
  - SUB-RULE,(RULE-SET,telegram),telegram_rules
  - SUB-RULE,(RULE-SET,SocialMedia),telegram_rules
  - SUB-RULE,(RULE-SET,github),github_rules
  - SUB-RULE,(RULE-SET,microsoft),microsoft_rules

  - SUB-RULE,(RULE-SET,steam),game_rules
  - SUB-RULE,(RULE-SET,games-global),game_rules
  - SUB-RULE,(RULE-SET,tiktok),tiktok_rules
  - SUB-RULE,(RULE-SET,twitch),media_rules
  
  - SUB-RULE,(RULE-SET,streaming),media_rules   
  - SUB-RULE,(RULE-SET,arr),arr_rules
  - SUB-RULE,(RULE-SET,other-proxy),proxy_rules
  
  - SUB-RULE,(RULE-SET,category-finance),safe_rules
  - SUB-RULE,(RULE-SET,stripe),safe_rules
  - SUB-RULE,(RULE-SET,paypal),safe_rules
  - SUB-RULE,(RULE-SET,category-cryptocurrency),safe_rules
  - SUB-RULE,(RULE-SET,reddit),safe_rules
  - RULE-SET,cn,直接连接
  - SUB-RULE,(RULE-SET,proxy),proxy_rules
  - SUB-RULE,(RULE-SET,gfw),proxy_rules
  
  ## —— ③ IP 规则（no-resolve，命中即定去向）——
  - RULE-SET,xptv_ip,直接连接,no-resolve
  - RULE-SET,bilibili_ip,直接连接,no-resolve
  - SUB-RULE,(RULE-SET,SocialMedia_ip,no-resolve),telegram_rules
  - SUB-RULE,(RULE-SET,google_ip,no-resolve),google_rules
  - SUB-RULE,(RULE-SET,apple_ip,no-resolve),apple_rules
  - SUB-RULE,(RULE-SET,streaming_ip,no-resolve),media_rules   
  - SUB-RULE,(RULE-SET,cloudflare_ip,no-resolve),cloudflare_rules
  - SUB-RULE,(RULE-SET,ai_ip,no-resolve),ai_rules
  - SUB-RULE,(RULE-SET,telegram_ip,no-resolve),telegram_rules
  # 国内兜底
  
  - RULE-SET,cn_ip,直接连接,no-resolve
  - DST-PORT,12443,直接连接
  - 'AND,((NETWORK,udp),(DST-PORT,443)),漏网之鱼QUIC'
  - MATCH,漏网之鱼

