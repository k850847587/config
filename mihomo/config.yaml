## ==================== 01. 机场订阅（订阅模板 + proxy-providers）====================
providers: &providers { type: http, proxy: DIRECT, header: { User-Agent: ["clash-verge/v2.5.1"] }, override: { skip-cert-verify: true,ip-version: dual } ,health-check: {enable: true,lazy: true, url: 'https://www.google.com/generate_204', interval: 600}, exclude-filter: '(?i)套餐|剩余|流量|到期|重置|频道|订阅|官网|禁止|客户端|有效|联系|测试|节点|日期|群组|加入|通知|维护|网址|地址|下载|更新|APP|登录|严禁|恢复|处理|谢谢' }
proxy-providers:
  link1: { <<: *providers, interval: 28800, url: 'https://example.com/REPLACE_WITH_LINK1_SUBSCRIPTION', path: ./providers/link1.yaml, health-check: { enable: true,lazy: true, url: 'https://www.google.com/generate_204', interval: 300}}
  link2: { <<: *providers, interval: 28810, url: 'https://example.com/REPLACE_WITH_LINK2_SUBSCRIPTION', path: ./providers/link2.yaml, health-check: { enable: true,lazy: true, url: 'https://www.google.com/generate_204', interval: 300}}
  link3: { <<: *providers, interval: 28820, url: 'https://example.com/REPLACE_WITH_LINK3_SUBSCRIPTION', path: ./providers/link3.yaml}
  link4: { <<: *providers, interval: 28830, url: 'https://example.com/REPLACE_WITH_LINK4_SUBSCRIPTION', path: ./providers/link4.yaml}
  link5: { <<: *providers, interval: 28840, url: 'https://example.com/REPLACE_WITH_LINK5_SUBSCRIPTION', path: ./providers/link5.yaml}
  link6: { <<: *providers, interval: 28850, url: 'https://example.com/REPLACE_WITH_LINK6_SUBSCRIPTION', path: ./providers/link6.yaml}
  link-vps: { <<: *providers, override: { skip-cert-verify: true, ip-version: dual, client-fingerprint: chrome }, interval: 28860, url: 'https://example.com/REPLACE_WITH_LINK_VPS_SUBSCRIPTION', path: ./providers/link-vps.yaml, health-check: { enable: true,lazy: true, url: 'https://www.google.com/generate_204', interval: 300}}
## ==================== 02. 复用锚点（地区 / 下载 / 手动选择 / DNS 服务器列表）====================
# 地区分组，建议区分普通节点和专线
area1: &area1 { use: [link1,link2] }
area2: &area2 { use: [link3,link4] }
area3: &area3 { use: [link5,link6] }
areaai1: &areaai1 { use: [link1,link2,link3] }
areaai2: &areaai2 { use: [link4,link5,link6] }
# 轮询下载
download: &download { use: [link1,link2] }
# 手动选择
use: &use { use: [link1,link2,link3,link4,link5,link6] }
proxy-dns: &proxy-dns ['https://cloudflare-dns.com/dns-query#默认代理','https://dns.google/dns-query#默认代理']
direct-dns: &direct-dns ['quic://dns.alidns.com:853#直接连接&ecs=202.96.64.0/24&ecs-override=true','udp://192.168.11.1:53']
proxy-dns-jiedian: &proxy-dns-jiedian ['udp://192.168.11.111:11153']
## ==================== 03. 基础设置（端口 / 模式 / 面板 / 实验性 / LightGBM）====================
ipv6: true
allow-lan: true
bind-address: '*'
mode: rule
log-level: error
find-process-mode: 'off'                  # 进程匹配模式 off 软路由 strict pc
etag-support: true                        # 强烈建议开启：优化外部资源更新逻辑，省流量且加速更新
unified-delay: true                       # 开启统一延迟 (计算 HTTP 响应时间)
tcp-concurrent: true                      # 开启 TCP 并发连接
disable-keep-alive: false                 # 开启长连接
keep-alive-interval: 15                   # TCP 保活间隔
keep-alive-idle: 600                      # TCP 空闲等待 
external-ui: ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-controller: '[::]:9090'
secret: "CHANGE_ME_CONTROLLER_SECRET"
profile: { store-selected: true, store-fake-ip: true, smart-collector-size: 300 }
experimental: { quic-go-disable-gso: false, quic-go-disable-ecn: false, dialer-ip4p-convert: false }
lgbm-auto-update: true
lgbm-update-interval: 72
lgbm-url: "https://ghproxy.net/https://github.com/vernesong/mihomo/releases/download/LightGBM-Model/Model.bin"
port: 0
socks-port: 0
mixed-port: 1081
redir-port: 7880
tproxy-port: 7893
