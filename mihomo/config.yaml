## ==================== 06. DNS（fake-ip 分流 / 上游服务器 / 域名嗅探前）====================
dns: 
  enable: true
  ipv6: true
  cache-algorithm: arc
  use-hosts: true
  use-system-hosts: true
  prefer-h3: true
  respect-rules: false
