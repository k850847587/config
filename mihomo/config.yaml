  youtube_rules: [*quic,'MATCH,YOUTUBE']
  arr_rules: [*quic,'MATCH,ARR']
  github_rules: [*quic,'MATCH,GITHUB']
  apple_rules: [*quic,'MATCH,APPLE']
  cloudflare_rules: [*quic,'MATCH,CLOUDFLARE']
  microsoft_rules: [*quic,'MATCH,MICROSOFT']
